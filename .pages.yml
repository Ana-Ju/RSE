# Configuration de Pages CMS (https://pagescms.org)
# Les bénévoles modifient data/evenements.json via un formulaire,
# sans toucher au code. Le site lit ce fichier et affiche les événements
# sur l'accueil (agenda) et sur la page Actualités.
content:
  - name: evenements
    label: Événements
    type: file
    path: data/evenements.json
    format: json
    list: true
    fields:
      - name: titre
        label: Titre
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: horaires
        label: Horaires (ex. 8h30–10h30)
        type: string
      - name: lieu
        label: Lieu
        type: string
      - name: resume
        label: Résumé (2 ou 3 phrases)
        type: text
      - name: partenaires
        label: Partenaires et infos pratiques
        type: string
      - name: lien_inscription
        label: Lien d'inscription (HelloAsso…)
        type: string

  - name: points_carte
    label: Points de la carte
    type: file
    path: data/points.json
    format: json
    list: true
    fields:
      - name: nom
        label: Nom de l'action
        type: string
        required: true
      - name: lieu
        label: Lieu
        type: string
      - name: resume
        label: Résumé (1 ou 2 phrases)
        type: text
      - name: lien
        label: Page vers laquelle le point renvoie
        description: Choisis la page du site qui parle de cette action. Le visiteur y arrive en cliquant sur « Voir l'activité » dans le point.
        type: select
        options:
          values:
            - name: actions.html
              label: Nos actions
            - name: actus.html
              label: Actualités
            - name: actus.html#evenements
              label: Actualités — Agenda / Événements
            - name: actus.html#provence
              label: Actualités — En Provence
            - name: asso.html
              label: L'association
            - name: adherer.html
              label: Adhérer
            - name: contact.html
              label: Contact
      - name: lat
        label: Latitude (ex. 43.296)
        type: number
        required: true
      - name: lng
        label: Longitude (ex. 5.37)
        type: number
        required: true
